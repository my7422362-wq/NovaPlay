<!-- ════════════════════════════════════════════
     NovaPlay — Contact Section
     ════════════════════════════════════════════ -->
<section
  id="contact"
  class="relative py-20 lg:py-0 lg:min-h-screen lg:flex lg:items-center lg:justify-center overflow-hidden"
>

  <!-- ═══ Background Gradient ═══ -->
  <div class="absolute inset-0 bg-gradient-to-b from-background via-[#0a0a1a] to-background"></div>

  <!-- ═══ Glow Orbs ═══ -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute -top-60 -right-60 w-[600px] h-[600px] rounded-full opacity-20"
      style="
        background: radial-gradient(circle, rgba(124,58,237,0.4) 0%, transparent 70%);
        animation: glowPulse 8s ease-in-out infinite;
      "
    ></div>
    <div
      class="absolute -bottom-60 -left-60 w-[500px] h-[500px] rounded-full opacity-15"
      style="
        background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, transparent 70%);
        animation: glowPulse 10s ease-in-out 2s infinite;
      "
    ></div>
  </div>

  <!-- ═══ Floating Decorative Shapes ═══ -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Diamond shape -->
    <div
      class="absolute top-20 left-10 w-6 h-6 border border-primary/20 rotate-45 floating-shape"
      style="animation: floatShape1 12s ease-in-out infinite;"
    ></div>
    <!-- Circle -->
    <div
      class="absolute bottom-32 right-16 w-4 h-4 rounded-full bg-secondary/20 floating-shape"
      style="animation: floatShape2 10s ease-in-out 1s infinite;"
    ></div>
    <!-- Ring -->
    <div
      class="absolute top-1/2 left-8 w-8 h-8 border border-secondary/10 rounded-full floating-shape"
      style="animation: floatShape1 14s ease-in-out 0.5s infinite;"
    ></div>
    <!-- Small dot -->
    <div
      class="absolute bottom-20 left-1/3 w-3 h-3 rounded-full bg-primary/15 floating-shape"
      style="animation: floatShape2 11s ease-in-out 2s infinite;"
    ></div>
  </div>

  <!-- ═══ Content ═══ -->
  <div class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- ═══ Section Header ═══ -->
<div class="text-center mb-10 lg:mb-8">
      <!-- Badge -->
      <div
        class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary/10 border border-primary/20 text-primary text-xs font-semibold tracking-wider uppercase mb-5"
        data-aos="fade-up"
        data-aos-duration="800"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
        Contact
      </div>

      <!-- Heading -->
      <h2
        class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight mb-4"
        data-aos="fade-up"
        data-aos-delay="100"
        data-aos-duration="800"
      >
        Let's Get in  <span class="text-gradient">Touch</span>
      </h2>

      <!-- Subtitle -->
      <p
        class="text-base sm:text-lg text-muted max-w-lg mx-auto"
        data-aos="fade-up"
        data-aos-delay="200"
        data-aos-duration="800"
      >
        Have a question, feedback, or business inquiry? We'd love to hear from you. Contact the NovaPlay team anytime and we'll be happy to help.
      </p>
    </div>

    <!-- ═══ Grid: Form + Info Cards ═══ -->
    <div class="w-full max-w-[700px] mx-auto">

      <!-- ═══════════════ LEFT: Contact Form ═══════════════ -->
      <div
        class="contact-form-wrapper"
        data-aos="fade-right"
        data-aos-delay="100"
        data-aos-duration="800"
      >
        <div class="relative glass rounded-3xl p-6 sm:p-8 md:p-8 border border-white/10">
          <!-- Inner glow -->
          <div class="absolute inset-0 rounded-3xl pointer-events-none"
            style="box-shadow: inset 0 0 40px rgba(124, 58, 237, 0.03);"
          ></div>

          <!-- Success / Error Messages -->
          <div id="contactSuccess" class="hidden relative mb-6 p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm flex items-center gap-3 transition-all duration-300">
            <i data-lucide="check-circle" class="w-5 h-5 shrink-0"></i>
            <span id="contactSuccessText">Your message has been sent successfully! We'll get back to you soon.</span>
          </div>
          <div id="contactError" class="hidden relative mb-6 p-4 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-3 transition-all duration-300">
            <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
            <span id="contactErrorText">Something went wrong. Please try again later.</span>
          </div>

          <form id="contactForm" class="relative space-y-5 lg:space-y-4">
            <!-- Full Name -->
            <div>
              <label for="contactName" class="block text-sm font-medium text-muted mb-2">Full Name</label>
              <input
                type="text"
                id="contactName"
                name="from_name"
                placeholder="Enter Full name"
                required
                autocomplete="name"
                class="contact-input w-full px-5 py-3.5 bg-white/5 border border-white/10 rounded-3xl text-text placeholder-muted/50 outline-none transition-all duration-300 focus:border-primary/50 focus:bg-white/[0.07] focus:shadow-[0_0_20px_rgba(124,58,237,0.1)] focus:scale-[1.01]"
              />
            </div>

            <!-- Email Address -->
            <div>
              <label for="contactEmail" class="block text-sm font-medium text-muted mb-2">Email Address</label>
              <input
                type="email"
                id="contactEmail"
                name="from_email"
                placeholder="Enter Your Email"
                required
                autocomplete="email"
                class="contact-input w-full px-5 py-3.5 bg-white/5 border border-white/10 rounded-3xl text-text placeholder-muted/50 outline-none transition-all duration-300 focus:border-primary/50 focus:bg-white/[0.07] focus:shadow-[0_0_20px_rgba(124,58,237,0.1)] focus:scale-[1.01]"
              />
            </div>

            <!-- Subject -->
            <div>
              <label for="contactSubject" class="block text-sm font-medium text-muted mb-2">Subject</label>
              <input
                type="text"
                id="contactSubject"
                name="subject"
                placeholder="Enter your subject"
                required
                class="contact-input w-full px-5 py-3.5 bg-white/5 border border-white/10 rounded-3xl text-text placeholder-muted/50 outline-none transition-all duration-300 focus:border-primary/50 focus:bg-white/[0.07] focus:shadow-[0_0_20px_rgba(124,58,237,0.1)] focus:scale-[1.01]"
              />
            </div>

            <!-- Message -->
            <div>
              <label for="contactMessage" class="block text-sm font-medium text-muted mb-2">Message</label>
              <textarea
                id="contactMessage"
                name="message"
                rows="4"
                placeholder="Enter your Message"
                required
                class="contact-input w-full px-5 py-3.5 bg-white/5 border border-white/10 rounded-3xl text-text placeholder-muted/50 outline-none resize-none transition-all duration-300 focus:border-primary/50 focus:bg-white/[0.07] focus:shadow-[0_0_20px_rgba(124,58,237,0.1)] focus:scale-[1.01]"
              ></textarea>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              id="submitBtn"
              class="submit-btn relative w-full py-4 px-6 rounded-2xl font-bold text-base overflow-hidden group transition-all duration-300 disabled:opacity-60 disabled:cursor-not-allowed"
            >
              <!-- Gradient background -->
              <span class="absolute inset-0 bg-gradient-to-r from-primary to-secondary opacity-100 group-hover:opacity-90 transition-opacity duration-300"></span>
              <!-- Shine overlay -->
              <span class="absolute inset-0 bg-[linear-gradient(120deg,transparent_30%,rgba(255,255,255,0.15)_50%,transparent_70%)] translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></span>
              <!-- Border glow on hover -->
              <span class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                style="box-shadow: 0 0 30px rgba(124, 58, 237, 0.4), 0 0 60px rgba(6, 182, 212, 0.2);"
              ></span>
              <!-- Button content -->
              <span id="submitBtnContent" class="relative z-10 flex items-center justify-center gap-3 text-white">
                <!-- Loading spinner (hidden by default) -->
                <svg id="submitSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <!-- Default icon -->
                <i id="submitIcon" data-lucide="send" class="w-5 h-5"></i>
                <!-- Button text -->
                <span id="submitText">Send Message</span>
              </span>
            </button>
          </form>
        </div>
      </div>

      
</section>
