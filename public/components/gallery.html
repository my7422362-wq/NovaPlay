<!-- ════════════════════════════════════════════
     NovaPlay — Premium Gallery Section
     Images Only · Clean CSS Grid
     ════════════════════════════════════════════ -->
<section
  id="gallery"
  class="relative py-20 lg:py-28 overflow-hidden"
>

  <!-- ═══ Background ═══ -->
  <div class="absolute inset-0 bg-gradient-to-b from-background via-[#0a0a1a] to-background"></div>

  <!-- ═══ Subtle Glow Orbs ═══ -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute -top-60 -right-60 w-[600px] h-[600px] rounded-full opacity-20"
      style="
        background: radial-gradient(circle, rgba(124,58,237,0.4) 0%, transparent 70%);
        animation: glowPulse 8s ease-in-out infinite;
      "
    ></div>
    <div
      class="absolute -bottom-60 -left-60 w-[500px] h-[500px] rounded-full opacity-15"
      style="
        background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, transparent 70%);
        animation: glowPulse 10s ease-in-out 2s infinite;
      "
    ></div>
  </div>

  <!-- ═══ Content ═══ -->
  <div class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- ═══ Section Header ═══ -->
    <div class="text-center mb-14 lg:mb-16">
      <!-- Badge -->
      <span
        class="inline-block bg-primary/10 text-primary text-xs font-semibold tracking-widest uppercase px-4 py-1.5 rounded-full mb-5"
        data-aos="fade-up"
        data-aos-duration="800"
      >
        Gallery
      </span>

      <!-- Main Title -->
      <h2
        class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight mb-4"
        data-aos="fade-up"
        data-aos-duration="800"
        data-aos-delay="100"
      >
        Explore Our <span class="text-gradient">Games</span>
      </h2>

      <!-- Subtitle -->
      <p
        class="text-base sm:text-lg text-muted max-w-lg mx-auto"
        data-aos="fade-up"
        data-aos-duration="800"
        data-aos-delay="200"
      >
        Discover a collection of stunning screenshots showcasing the immersive worlds, exciting gameplay, and unforgettable moments waiting for you inside NovaPlay.
      </p>
    </div>
